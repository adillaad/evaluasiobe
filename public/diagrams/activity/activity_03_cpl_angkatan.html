<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 20px; background: #ffffff; display: flex; justify-content: center; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1420" width="960" height="1420" style="background-color: #f8fafc; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="headerGradActor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="headerGradSys" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="extendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="900" height="60" rx="10" fill="#1e293b" filter="url(#shadow)"/>
  <text x="480" y="44" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">UML 2.0 ACTIVITY DIAGRAM</text>
  <text x="480" y="66" font-size="13" font-weight="500" fill="#93c5fd" text-anchor="middle">Use Case: Melihat Visualisasi CPL per Angkatan</text>

  <!-- Swimlane Backgrounds -->
  <!-- Left Lane: Actor -->
  <rect x="60" y="95" width="420" height="1295" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 60 103 a 8 8 0 0 1 8 -8 h 404 a 8 8 0 0 1 8 8 v 42 h -420 z" fill="url(#headerGradActor)"/>
  <text x="270" y="125" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">AKTOR: PMPS, Kaprodi, &amp; Dosen</text>
  <text x="270" y="142" font-size="11" font-weight="400" fill="#bfdbfe" text-anchor="middle">Pengguna Sistem Evaluasi OBE</text>

  <!-- Right Lane: System -->
  <rect x="480" y="95" width="420" height="1295" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 480 103 a 8 8 0 0 1 8 -8 h 404 a 8 8 0 0 1 8 8 v 42 h -420 z" fill="url(#headerGradSys)"/>
  <text x="690" y="125" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">SISTEM: Sistem Evaluasi OBE</text>
  <text x="690" y="142" font-size="11" font-weight="400" fill="#a7f3d0" text-anchor="middle">Aplikasi Web Laravel Backend &amp; Visual Engine</text>

  <!-- Initial Node -->
  <circle cx="270" cy="175" r="14" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="270" cy="175" r="9" fill="#0f172a"/>
  <text x="295" y="179" font-size="11" font-weight="600" fill="#475569">Mulai</text>

  <!-- Line from Start to Action 1 -->
  <line x1="270" y1="189" x2="270" y2="205" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Action 1: Masuk Menu -->
  <rect x="130" y="205" width="280" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="270" y="225" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">Memilih Menu Navigasi</text>
  <text x="270" y="243" font-size="11" font-weight="400" fill="#3b82f6" text-anchor="middle">"Visualisasi Per Angkatan" (CPL)</text>

  <!-- Transition to System -->
  <path d="M 410 230 H 690 V 275" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Action 2: Menampilkan Form Filter -->
  <rect x="550" y="275" width="280" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="690" y="295" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">Menampilkan Antarmuka Filter</text>
  <text x="690" y="313" font-size="11" font-weight="400" fill="#059669" text-anchor="middle">Dropdown Prodi, Tahun Angkatan, & Periode</text>

  <!-- Transition to Actor -->
  <path d="M 550 300 H 445 V 375 H 415" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Action 3: Memilih Filter -->
  <rect x="125" y="350" width="290" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="270" y="370" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">Menentukan Parameter Filter</text>
  <text x="270" y="388" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">Prodi, Tahun Angkatan, & Periode Evaluasi</text>

  <!-- Line from Action 3 to Action 4 -->
  <line x1="270" y1="400" x2="270" y2="425" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Action 4: Klik Tampilkan -->
  <rect x="130" y="425" width="280" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="270" y="445" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">Mengklik Tombol</text>
  <text x="270" y="463" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">"Tampilkan Visualisasi"</text>

  <!-- Line from Action 4 to Action 5 -->
  <line x1="410" y1="450" x2="550" y2="450" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Action 5: Validasi Input -->
  <rect x="550" y="425" width="280" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="690" y="445" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">Memvalidasi Kelengkapan</text>
  <text x="690" y="463" font-size="11" font-weight="400" fill="#059669" text-anchor="middle">Parameter Filter yang Dipilih</text>

  <!-- Line to Decision 1 -->
  <line x1="690" y1="475" x2="690" y2="505" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision Node 1 -->
  <polygon points="690,505 745,530 690,555 635,530" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="690" y="527" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">Parameter</text>
  <text x="690" y="540" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">Valid?</text>

  <!-- Decision 1 Branch: [Tidak Valid] -> Action Error Notification -> Loop Back -->
  <line x1="745" y1="530" x2="800" y2="530" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="748" y="505" width="50" height="17" rx="3" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="773" y="517" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="middle">[Tidak]</text>

  <!-- Action: Menampilkan Notifikasi Error -->
  <rect x="800" y="508" width="86" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="843" y="525" font-size="9" font-weight="600" fill="#991b1b" text-anchor="middle">Menampilkan</text>
  <text x="843" y="539" font-size="9" font-weight="600" fill="#991b1b" text-anchor="middle">Notifikasi Form</text>

  <!-- Loop back from Error to Action 3 -->
  <path d="M 843 508 V 375 H 415" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/>

  <!-- Decision 1 Branch: [Valid] -> Next Step -->
  <line x1="690" y1="555" x2="690" y2="595" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="698" y="565" width="50" height="18" rx="3" fill="#d1fae5"/>
  <text x="723" y="578" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">[Valid]</text>

  <!-- Action 6: Query Database -->
  <rect x="545" y="610" width="290" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="690" y="630" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">Mengambil Data Kohort Angkatan</text>
  <text x="690" y="648" font-size="11" font-weight="400" fill="#059669" text-anchor="middle">Rekapitulasi visualisasi_angkatans & mutus</text>

  <line x1="690" y1="660" x2="690" y2="690" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Action 7: Kalkulasi Statistik OBE -->
  <rect x="545" y="690" width="290" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="690" y="710" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">Menghitung Rata-rata CPL</text>
  <text x="690" y="728" font-size="11" font-weight="400" fill="#059669" text-anchor="middle">Benchmark Target OBE & Tren Semester Angkatan</text>

  <line x1="690" y1="740" x2="690" y2="770" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Action 8: Render Tampilan Visual -->
  <rect x="545" y="770" width="290" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="690" y="790" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">Merender Grafik Kohort</text>
  <text x="690" y="808" font-size="11" font-weight="400" fill="#059669" text-anchor="middle">Radar Chart CPL Angkatan & Bar Chart Rata-rata</text>

  <!-- Transition to Actor View -->
  <path d="M 545 795 H 445 V 875 H 415" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Action 9: Aktor Melihat & Menganalisis Visualisasi -->
  <rect x="125" y="850" width="290" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="270" y="870" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">Mengevaluasi Ketercapaian</text>
  <text x="270" y="888" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">Visualisasi Capaian CPL Tingkat Angkatan</text>

  <line x1="270" y1="900" x2="270" y2="935" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision Node 2: Cetak Laporan (Extend) -->
  <polygon points="270,935 345,960 270,985 195,960" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="270" y="957" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">Ingin Cetak</text>
  <text x="270" y="970" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">Laporan?</text>

  <!-- Branch [Tidak] -> Direct to Merge Node -->
  <path d="M 195 960 H 100 V 1275 H 255" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="95" y="942" width="48" height="18" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="119" y="955" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">[Tidak]</text>

  <!-- Branch [Ya <<extend>>] -> Extend Action -->
  <line x1="270" y1="985" x2="270" y2="1025" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="280" y="995" width="125" height="20" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="342" y="1009" font-size="9.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">[Ya &lt;&lt;extend&gt;&gt;]</text>

  <!-- Action 10: Klik Tombol Cetak PDF -->
  <rect x="125" y="1035" width="290" height="52" rx="8" fill="url(#extendGrad)" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3" filter="url(#cardShadow)"/>
  <rect x="130" y="1039" width="95" height="16" rx="3" fill="#fbbf24"/>
  <text x="177" y="1051" font-size="9" font-weight="800" fill="#78350f" text-anchor="middle">&lt;&lt;EXTEND USE CASE&gt;&gt;</text>
  <text x="270" y="1066" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">Klik Tombol "Cetak Laporan Angkatan"</text>
  <text x="270" y="1080" font-size="10" font-weight="500" fill="#b45309" text-anchor="middle">Mengirim Request Generate PDF</text>

  <!-- Transition to System Backend PDF -->
  <line x1="415" y1="1060" x2="545" y2="1060" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- Action 11: Backend Generate PDF -->
  <rect x="545" y="1035" width="290" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="690" y="1055" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Generate Dokumen PDF CPL Angkatan</text>
  <text x="690" y="1073" font-size="10.5" font-weight="400" fill="#b45309" text-anchor="middle">Render View PDF &amp; Konversi Format</text>

  <line x1="690" y1="1087" x2="690" y2="1125" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Action 12: Download File PDF -->
  <rect x="545" y="1125" width="290" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="690" y="1145" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">Unduh PDF Laporan CPL Angkatan</text>
  <text x="690" y="1163" font-size="10.5" font-weight="400" fill="#059669" text-anchor="middle">Mengirim Stream Berkas PDF ke Browser</text>

  <line x1="545" y1="1150" x2="415" y2="1150" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Action 13: Menerima Berkas PDF -->
  <rect x="125" y="1125" width="290" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="270" y="1145" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">Menerima &amp; Membuka</text>
  <text x="270" y="1163" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">Dokumen Berkas Laporan PDF</text>

  <!-- Line from Action 13 to Merge Node -->
  <line x1="270" y1="1175" x2="270" y2="1260" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Merge Node -->
  <polygon points="270,1260 285,1275 270,1290 255,1275" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>

  <!-- Line to Activity Final Node -->
  <line x1="270" y1="1290" x2="270" y2="1327" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Activity Final Node -->
  <circle cx="270" cy="1345" r="17" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="270" cy="1345" r="10" fill="#0f172a"/>
  <text x="298" y="1350" font-size="12" font-weight="700" fill="#334155">Selesai</text>

  <!-- Legend Box -->
  <rect x="520" y="1235" width="360" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="535" y="1255" font-size="11" font-weight="700" fill="#334155">Keterangan Notasi UML Activity Diagram:</text>

  <circle cx="545" cy="1275" r="7" fill="#0f172a"/>
  <text x="560" y="1279" font-size="10" fill="#475569">Initial Node (Mulai)</text>

  <rect x="685" y="1268" width="22" height="14" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="715" y="1279" font-size="10" fill="#475569">Action State (Aktivitas)</text>

  <polygon points="545,1298 553,1305 545,1312 537,1305" fill="#fef3c7" stroke="#d97706"/>
  <text x="560" y="1309" font-size="10" fill="#475569">Decision / Merge Node</text>

  <circle cx="695" cy="1305" r="8" fill="none" stroke="#0f172a" stroke-width="2"/>
  <circle cx="695" cy="1305" r="4.5" fill="#0f172a"/>
  <text x="715" y="1309" font-size="10" fill="#475569">Activity Final Node (Selesai)</text>
</svg>

</body>
</html>
